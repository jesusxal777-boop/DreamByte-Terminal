name: Build DreamByte Terminal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamByte-Terminal-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Determine next release version
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          releases_json="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | {tag_name, name}]' |
            jq -s 'add'
          )"

          latest="$(
            printf '%s' "$releases_json" |
            jq -r '
              .[]
              | [(.tag_name // ""), (.name // "")]
              | join(" ")
              | scan("[0-9]+\\.[0-9]+")
            ' |
            sort -V |
            tail -n 1
          )"

          if [ -z "$latest" ]; then
            version="0.0"
          else
            major="${latest%.*}"
            minor="${latest#*.}"
            version="$major.$((10#$minor + 1))"
          fi

          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Next release: $tag"

      - name: Prepare APK for Release
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          apk="$(
            find app/build/outputs/apk/debug \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
            head -n 1
          )"

          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          mkdir -p release

          cp "$apk" "release/DreamByte-Terminal-v${VERSION}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
          TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "release/DreamByte-Terminal-v${VERSION}.apk#DreamByte-Terminal-v${VERSION}.apk" \
            --title "DreamByte Terminal $VERSION" \
            --generate-notes

          echo "Published DreamByte Terminal $VERSION"
